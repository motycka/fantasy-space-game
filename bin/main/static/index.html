<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fantasy.Space - Character Management</title>
    <!-- Add Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Add Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container mt-4">
        <div class="brand-header mb-4 d-flex justify-content-between align-items-start">
            <div>
                <h1 class="game-title">Fantasy.Space</h1>
                <p class="game-subtitle">Where Magic Meets the Space</p>
            </div>
            <button class="btn btn-logout" onclick="handleLogout()" title="Leave the Space">
                <i class="fas fa-dungeon me-0"></i>
            </button>
        </div>

        <!-- Tabs Navigation -->
        <ul class="nav nav-tabs mb-4" id="mainTabs">
            <li class="nav-item">
                <a href="#characters" class="nav-link active" id="characters-tab" data-bs-toggle="tab"
                        data-bs-target="#characters" type="button"
                        aria-controls="characters">
                    Characters
                </a>
            </li>
            <li class="nav-item">
                <a href="#matches" class="nav-link" id="matches-tab" data-bs-toggle="tab"
                        data-bs-target="#matches" type="button"
                        aria-controls="matches">
                    Matches
                </a>
            </li>
            <li class="nav-item">
                <a href="#leaderboard" class="nav-link" id="leaderboard-tab" data-bs-toggle="tab"
                        data-bs-target="#leaderboard" type="button"
                        aria-controls="leaderboard">
                    Leaderboard
                </a>
            </li>
        </ul>

        <!-- Tabs Content -->
        <div class="tab-content" id="mainTabsContent">
            <div class="tab-pane fade show active" id="characters" role="tabpanel" aria-labelledby="characters-tab">
                <characters-tab></characters-tab>
            </div>
            <div class="tab-pane fade" id="matches" role="tabpanel" aria-labelledby="matches-tab">
                <matches-tab></matches-tab>
            </div>
            <div class="tab-pane fade" id="leaderboard" role="tabpanel" aria-labelledby="leaderboard-tab">
                <leaderboard-tab></leaderboard-tab>
            </div>
        </div>
    </div>

    <!-- Add character dialog component -->
    <character-dialog></character-dialog>

    <!-- Add the match form modal -->
    <div class="modal fade" id="newMatchModal" tabindex="-1" aria-labelledby="newMatchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4">
                        <!-- Challenger Selection -->
                        <div class="col-md-6">
                            <div class="card h-100">
                                <div class="card-header">
                                    <h5 class="mb-0">Challenger</h5>
                                </div>
                                <div class="card-body">
                                    <div class="character-select-container">
                                    <select id="challengerSelect" class="form-select mb-3">
                                        <option value="">Select challenger...</option>
                                    </select>
                                    </div>
                                    <div id="challengerStats" class="character-properties mt-3">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Opponent Selection -->
                        <div class="col-md-6">
                            <div class="card h-100">
                                <div class="card-header">
                                    <h5 class="mb-0">Opponent</h5>
                                </div>
                                <div class="card-body">
                                    <select id="opponentSelect" class="form-select mb-3">
                                        <option value="">Select opponent...</option>
                                    </select>
                                    <div id="opponentStats" class="character-properties mt-3">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="d-flex align-items-center">
                        <label for="roundsSelect" class="me-2">Rounds:</label>
                        <select id="roundsSelect" class="form-select form-select-sm" style="width: auto;">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="30">30</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                    <div class="ms-auto">
                        <button id="randomMatchButton" class="btn btn-cosmic-outline">
                            <i class="fas fa-random"></i> Random Match
                        </button>
                        <button id="fightButton" class="btn btn-cosmic" disabled>
                            <i class="fas fa-swords"></i> Fight!
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Match Result Modal -->
    <div class="modal fade" id="matchResultModal" tabindex="-1" aria-labelledby="matchResultModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4">
                        <!-- Challenger Results -->
                        <div class="col-md-6">
                            <div class="card h-100">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h6 class="mb-0 challenger-name">Challenger</h6>
                                    <span class="badge challenger-result"></span>
                                </div>
                                <div class="card-body challenger-stats">
                                </div>
                            </div>
                        </div>

                        <!-- Opponent Results -->
                        <div class="col-md-6">
                            <div class="card h-100">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h6 class="mb-0 opponent-name">Opponent</h6>
                                    <span class="badge opponent-result"></span>
                                </div>
                                <div class="card-body opponent-stats">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Rounds Timeline -->
                    <div class="rounds-timeline mt-4">
                        <h6 class="mb-3">Battle Timeline</h6>
                        <div class="rounds-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Bootstrap JS and its dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/index.js"></script>
</body>
</html>
